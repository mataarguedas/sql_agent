[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent"
version = "0.1.0"
description = "Natural-language-to-SQL agent over PostgreSQL, built on LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph~=0.2",
    "langchain~=0.3",
    "langchain-openai~=0.2",
    "langchain-community~=0.3",
    "pydantic~=2.9",
    "psycopg[binary]~=3.2",
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "langsmith~=0.1",
    "sqlglot~=25.0",
    "python-dotenv~=1.0",
    "sqlalchemy~=2.0",
    "bcrypt~=4.2",
    "pyotp~=2.9",
    "qrcode[pil]~=7.4",
    "itsdangerous~=2.2",
    "python-multipart~=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "httpx~=0.27",
]

[tool.setuptools.packages.find]
include = ["graph*", "db*", "api*", "evals*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
