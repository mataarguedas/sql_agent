<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - SQL Analyst Agent</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --border: #e2e5ea;
    --text: #1c1f24;
    --muted: #6b7280;
    --accent: #2563eb;
    --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1b1f26;
      --border: #2c323c;
      --text: #e6e9ee;
      --muted: #98a1b0;
      --accent: #6ea8fe;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form {
    width: 100%;
    max-width: 320px;
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
  input {
    width: 100%;
    font: inherit;
    padding: 9px 10px;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input[name=code] { letter-spacing: .2em; font-variant-numeric: tabular-nums; }
  button {
    width: 100%;
    margin-top: 20px;
    font: inherit; font-weight: 600;
    padding: 10px;
    color: #fff; background: var(--accent);
    border: none; border-radius: 8px; cursor: pointer;
  }
  .error {
    margin-top: 14px;
    font-size: 13px;
    color: var(--err);
    text-align: center;
  }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>SQL Analyst Agent</h1>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <label for="code">Authenticator code</label>
  <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
         autocomplete="one-time-code" placeholder="123456" required>
  <button type="submit">Sign in</button>
  <div class="error" id="error" hidden></div>
</form>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("error")) {
    const box = document.getElementById("error");
    box.hidden = false;
    box.textContent = params.get("error") === "rate_limited"
      ? "Too many attempts. Try again in a few minutes."
      : "Invalid username, password, or code.";
  }
</script>
</body>
</html>
